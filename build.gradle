plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'dev.deftu.gradle.tools.bloom' version '2.73.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/coresmodule.accesswidener")
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven {
        name = "Team Resourceful Maven"
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        url = "https://repo.essential.gg/repository/maven-public"
    }

    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
}

bloom {

}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

// Loom's `include(...)` bundles a dependency's own jar into the mod jar, but it is
// explicitly NOT transitive - it will not pull in that dependency's own runtime
// dependencies. JDA needs OkHttp (which itself needs Okio and, since OkHttp 4.x is
// written in Kotlin, kotlin-stdlib), the nv-websocket-client, and Jackson at runtime.
// Rather than guessing versions and adding them one by one (which is how the
// okhttp3.Dispatcher NoClassDefFoundError happened), we resolve JDA's actual runtime
// dependency graph ourselves in this separate configuration and include everything
// it resolves to.
configurations {
    jdaRuntime
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Config menu
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-common-$rconfig_version"
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-$rconfig_version"

    // UIs
    implementation("gg.essential:elementa:$elementaVersion")
    implementation "gg.essential:universalcraft-26.1-fabric:$uc_version"

    // Jetbrains annotations
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
    implementation(include("org.json:json:$json_version"))

    // ClassGraph - for preprocessor scanning.
    implementation(include("io.github.classgraph:classgraph:4.8.194"))

    // For devauth
    implementation "org.apache.httpcomponents:httpclient:4.5.14"

    // Discord API (JDA) - included in the mod jar so it works.
    // Also include a simple SLF4J binding to avoid runtime warnings about missing SLF4J implementations.
    // Also include Trove4j, which JDA depends on, to avoid NoClassDefFoundErrors at runtime.
    implementation("net.dv8tion:JDA:$JDA_v") {
        exclude module: 'opus-java'
    }

    implementation(include("org.slf4j:slf4j-simple:2.0.18"))

    // Resolve JDA's full runtime dependency tree - JDA itself plus OkHttp, Okio,
    // kotlin-stdlib, nv-websocket-client, Jackson, trove4j, etc. - and jar-in-jar
    // every artifact it resolves to. (The plain `implementation("net.dv8tion:JDA...")`
    // line above is NOT wrapped in include(), so on its own it only helps the dev
    // environment; it does nothing for an exported/packaged mod jar. This loop is
    // what actually bundles JDA - and everything it needs - into the built jar.)
    jdaRuntime("net.dv8tion:JDA:$JDA_v") {
        exclude module: 'opus-java'
    }
    afterEvaluate {
        configurations.jdaRuntime.resolvedConfiguration.resolvedArtifacts.each {
            include("${it.moduleVersion.id}")
        }
    }

    // DevAuth
    runtimeOnly("me.djtheredstoner:DevAuth-fabric:${property("devauth.version")}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}


// Avoid StackOverflowError when running the mod. Bug that smh appeared since 26.1.2 version update
configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

tasks.register('TODOsChecker') {
    group = 'verification'
    description = 'Scans source files for TODO comments and prints warnings.'

    def srcDir = file("src/main")

    doLast {
        if (!srcDir.exists()) return

        int todoCount = 0

        srcDir.eachFileRecurse { file ->
            if (file.isFile() && (file.name.endsWith('.java') || file.name.endsWith('.groovy'))) {
                file.eachLine { line, lineNumber ->
                    if (line =~ /(?i)\bTODO\b/) {
                        todoCount++
                        def trimmedEnd = line.replaceAll(/\s+$/, '')
                        int column = trimmedEnd.length() + 1 // 1-indexed: length == index of last char
                        System.err.println("WARNING: file:${file.absolutePath}:${lineNumber}:${column}: ${line.trim()}")
                    }
                }
            }
        }
    }
}

// Automatically run this scan whenever you compile or build the project
tasks.named('compileJava') {
    dependsOn 'TODOsChecker'
}